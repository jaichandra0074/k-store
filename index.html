<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>k-store - E-Commerce Store</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f7fb;
    }

    header{
      background:#0f172a;
      color:white;
      padding:20px 40px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:20px;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .logo{
      font-size:32px;
      font-weight:bold;
    }

    .search-box{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .search-box input{
      padding:12px;
      width:260px;
      border:none;
      border-radius:10px;
      outline:none;
      font-size:15px;
    }

    .search-box button{
      padding:12px 18px;
      border:none;
      border-radius:10px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .cart-count{
      background:#2563eb;
      padding:12px 18px;
      border-radius:10px;
      font-weight:bold;
    }

    /* HERO */

    .hero{
      height:320px;

      background:
      linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5)),
      url('https://images.unsplash.com/photo-1523381210434-271e8be1f52b?q=80&w=1200&auto=format&fit=crop');

      background-size:cover;
      background-position:center;

      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;
      color:white;
      padding:20px;
    }

    .hero h1{
      font-size:55px;
      margin-bottom:15px;
    }

    .hero p{
      font-size:22px;
    }

    /* CATEGORY */

    .category-bar{
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
      padding:25px;
    }

    .category-btn{
      padding:12px 18px;
      border:none;
      border-radius:30px;
      background:white;
      cursor:pointer;
      font-weight:bold;
      box-shadow:0 3px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .category-btn:hover{
      background:#2563eb;
      color:white;
    }

    /* PRODUCTS */

    .products{
      padding:30px;
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
      gap:25px;
    }

    .card{
      background:white;
      border-radius:18px;
      overflow:hidden;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
      transition:0.3s;
      display:flex;
      flex-direction:column;
    }

    .card:hover{
      transform:translateY(-8px);
    }

    .card img{
      width:100%;
      height:250px;
      object-fit:contain;
      padding:20px;
      background:white;
    }

    .card-body{
      padding:20px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      flex:1;
    }

    .product-title{
      font-size:18px;
      font-weight:bold;
      margin-bottom:10px;
      height:50px;
      overflow:hidden;
    }

    .category{
      display:inline-block;
      background:#dbeafe;
      color:#1e40af;
      padding:6px 12px;
      border-radius:20px;
      font-size:13px;
      margin-bottom:10px;
    }

    .price{
      font-size:25px;
      color:#2563eb;
      font-weight:bold;
      margin-bottom:10px;
    }

    .rating{
      color:#f59e0b;
      margin-bottom:15px;
    }

    .btn-cart{
      padding:12px;
      border:none;
      border-radius:10px;
      background:#111827;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .btn-cart:hover{
      background:#2563eb;
    }

    /* CART SECTION */

    .cart-section{
      margin:40px 30px;
      background:white;
      border-radius:20px;
      padding:25px;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }

    .cart-section h2{
      margin-bottom:20px;
      color:#111827;
    }

    .cart-item{
      display:flex;
      gap:20px;
      align-items:center;
      border-bottom:1px solid #ddd;
      padding:20px 0;
      flex-wrap:wrap;
    }

    .cart-item img{
      width:90px;
      height:90px;
      object-fit:contain;
    }

    .cart-details{
      flex:1;
    }

    .cart-details h4{
      margin-bottom:10px;
    }

    .qty-buttons{
      display:flex;
      align-items:center;
      gap:10px;
      margin-top:10px;
    }

    .qty-buttons button{
      padding:5px 12px;
      border:none;
      border-radius:5px;
      color:white;
      cursor:pointer;
      font-weight:bold;
    }

    .minus{
      background:red;
    }

    .plus{
      background:green;
    }

    .grand-total{
      margin-top:25px;
      background:#f1f5f9;
      padding:20px;
      border-radius:10px;
      font-size:28px;
      font-weight:bold;
      color:#111827;
      text-align:right;
    }

    .empty{
      text-align:center;
      color:gray;
      font-size:20px;
      padding:20px;
    }

    footer{
      background:#0f172a;
      color:white;
      text-align:center;
      padding:20px;
      margin-top:40px;
    }

    @media(max-width:768px){

      .hero h1{
        font-size:38px;
      }

      header{
        justify-content:center;
      }

      .search-box input{
        width:100%;
      }

      .cart-item{
        flex-direction:column;
        align-items:flex-start;
      }

    }

  </style>

</head>

<body>

  <!-- HEADER -->

  <header>

    <div class="logo">🛒 K-store</div>

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search products..."
      >

      <button onclick="searchProducts()">
        Search
      </button>

    </div>

    <div class="cart-count">
      Cart Items:
      <span id="cartCount">0</span>
    </div>

  </header>

  <!-- HERO -->

  <section class="hero">

    <div>
      <h1>Modern E-Commerce Store</h1>
    </div>

  </section>

  <!-- CATEGORY -->

  <div class="category-bar">

    <button class="category-btn"
    onclick="filterCategory('all')">
      All
    </button>

    <button class="category-btn"
    onclick="filterCategory('electronics')">
      Electronics
    </button>

    <button class="category-btn"
    onclick="filterCategory('jewelery')">
      Jewellery
    </button>

    <button class="category-btn"
    onclick="filterCategory(`men's clothing`)">
      Men's
    </button>

    <button class="category-btn"
    onclick="filterCategory(`women's clothing`)">
      Women's
    </button>

  </div>

  <!-- PRODUCTS -->

  <div class="products" id="products"></div>

  <!-- CART SECTION -->

  <section class="cart-section">

    <h2>🛍 Shopping Cart</h2>

    <div id="cartItems"></div>

  </section>

  <!-- FOOTER -->

  <footer>
    Created using HTML, CSS, JavaScript & FakeStore API
  </footer>

  <script>

    let allProducts = [];

    let cart = [];

    // FETCH PRODUCTS

    async function fetchProducts(){

      const response =
      await fetch(
        "https://fakestoreapi.com/products"
      );

      const data = await response.json();

      allProducts = data;

      displayProducts(data);

    }

    // DISPLAY PRODUCTS

    function displayProducts(products){

      const productsContainer =
      document.getElementById("products");

      productsContainer.innerHTML = "";

      if(products.length === 0){

        productsContainer.innerHTML =
        "<h2>No Products Found</h2>";

        return;

      }

      products.forEach(product => {

        const rupeePrice =
        Math.round(product.price * 83);

        const card =
        document.createElement("div");

        card.classList.add("card");

        card.innerHTML = `

          <img src="${product.image}">

          <div class="card-body">

            <div>

              <div class="product-title">
                ${product.title}
              </div>

              <div class="category">
                ${product.category}
              </div>

              <div class="price">
                ₹${rupeePrice}
              </div>

              <div class="rating">
                ⭐ ${product.rating.rate}
              </div>

            </div>

            <button
              class="btn-cart"
              onclick="addToCart(${product.id})"
            >
              Add To Cart
            </button>

          </div>

        `;

        productsContainer.appendChild(card);

      });

    }

    // ADD TO CART

    function addToCart(productId){

      const product =
      allProducts.find(item =>

        item.id === productId

      );

      const existingProduct =
      cart.find(item =>

        item.id === productId

      );

      if(existingProduct){

        existingProduct.quantity++;

      }

      else{

        cart.push({
          ...product,
          quantity:1
        });

      }

      document.getElementById("cartCount")
      .innerHTML = cart.length;

      renderCart();

    }

    // RENDER CART

    function renderCart(){

      const cartItems =
      document.getElementById("cartItems");

      cartItems.innerHTML = "";

      if(cart.length === 0){

        cartItems.innerHTML = `
          <div class="empty">
            Cart is Empty
          </div>
        `;

        return;

      }

      let grandTotal = 0;

      cart.forEach((item,index) => {

        const rupeePrice =
        Math.round(item.price * 83);

        const total =
        rupeePrice * item.quantity;

        grandTotal += total;

        cartItems.innerHTML += `

          <div class="cart-item">

            <img src="${item.image}">

            <div class="cart-details">

              <h4>
                ${item.title}
              </h4>

              <p>
                Price: ₹${rupeePrice}
              </p>

              <div class="qty-buttons">

                <button
                  class="minus"
                  onclick="decreaseQty(${index})"
                >
                  -
                </button>

                <span>
                  ${item.quantity}
                </span>

                <button
                  class="plus"
                  onclick="increaseQty(${index})"
                >
                  +
                </button>

              </div>

              <p style="margin-top:10px;font-weight:bold;">
                Total: ₹${total}
              </p>

            </div>

          </div>

        `;

      });

      cartItems.innerHTML += `

        <div class="grand-total">

          Grand Total: ₹${grandTotal}

        </div>

      `;

    }

    // INCREASE QUANTITY

    function increaseQty(index){

      cart[index].quantity++;

      renderCart();

    }

    // DECREASE QUANTITY

    function decreaseQty(index){

      if(cart[index].quantity > 1){

        cart[index].quantity--;

      }

      else{

        cart.splice(index,1);

      }

      document.getElementById("cartCount")
      .innerHTML = cart.length;

      renderCart();

    }

    // SEARCH PRODUCTS

    function searchProducts(){

      const searchValue =
      document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();

      const filteredProducts =
      allProducts.filter(product =>

        product.title
        .toLowerCase()
        .includes(searchValue)

      );

      displayProducts(filteredProducts);

    }

    // SEARCH ON ENTER KEY

    document
    .getElementById("searchInput")
    .addEventListener("keyup", function(event){

      if(event.key === "Enter"){

        searchProducts();

      }

    });

    // FILTER CATEGORY

    function filterCategory(category){

      if(category === "all"){

        displayProducts(allProducts);

      }

      else{

        const filtered =
        allProducts.filter(product =>

          product.category === category

        );

        displayProducts(filtered);

      }

    }

    // INITIAL LOAD

    fetchProducts();

  </script>

</body>
</html>
